services:
  postgres:
    image: postgres:17-alpine
    container_name: wcs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wcs}
      POSTGRES_USER: ${POSTGRES_USER:-wcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "5432:5432"
    volumes:
      - wcs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wcs-postgres-data:
