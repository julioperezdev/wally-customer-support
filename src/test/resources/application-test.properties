spring.datasource.url=jdbc:h2:mem:wcs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
wcs.whatsapp.adapter=mock
wcs.ai.provider=mock
wcs.rag.provider=mock
wcs.whatsapp.verify-token=synthetic-verify-token
wcs.whatsapp.app-secret=synthetic-app-secret
