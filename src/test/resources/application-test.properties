# The datasource is supplied by PostgreSQL Testcontainers in the Spring Boot
# integration test. No local database or external credentials are required.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=wcs
spring.flyway.schemas=wcs
spring.jpa.properties.hibernate.default_schema=wcs
wcs.whatsapp.adapter=mock
wcs.ai.provider=mock
wcs.ai.prompt.intent-version=conversation-intent-v1
wcs.ai.prompt.intent-max-output-tokens=1024
wcs.ai.prompt.intent-temperature=0.0
wcs.ai.prompt.max-input-characters=2000
wcs.ai.prompt.max-history-messages=12
wcs.conversation.guardrails.min-intent-confidence=0.65
wcs.rag.provider=mock
wcs.conversation.memory.enabled=true
wcs.conversation.summary.enabled=true
wcs.conversation.preferences.enabled=true
wcs.conversation.preferences.ttl=PT24H
wcs.conversation.preferences.max-preferences=5
wcs.conversation.preferences.max-value-characters=64
wcs.inbound.poll-interval-ms=600000
wcs.inbound.batch-size=20
wcs.inbound.max-attempts=3
wcs.inbound.lease-duration=PT5M
wcs.inbound.retry-delay=PT30S
wcs.external-config.appconfig.enabled=false
wcs.external-config.secrets-manager.enabled=false
wcs.whatsapp.verify-token=synthetic-verify-token
wcs.whatsapp.app-secret=synthetic-app-secret
