spring.application.name=wally-customer-support
server.port=${SERVER_PORT:8080}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wcs}
spring.datasource.username=${DATABASE_USERNAME:wcs}
spring.datasource.password=${DATABASE_PASSWORD:}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Non-secret configuration is intended to come from AWS AppConfig in shared
# environments. Environment placeholders keep local development reproducible.
wcs.whatsapp.adapter=${WCS_WHATSAPP_ADAPTER:mock}
wcs.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v25.0}
wcs.whatsapp.graph-api-base-url=${WHATSAPP_GRAPH_API_BASE_URL:https://graph.facebook.com}
wcs.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
wcs.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
wcs.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
wcs.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
wcs.whatsapp.app-secret=${META_APP_SECRET:}
wcs.whatsapp.allowed-recipient=${WCS_ALLOWED_RECIPIENT:}
wcs.whatsapp.connect-timeout=${WCS_WHATSAPP_CONNECT_TIMEOUT:PT2S}
wcs.whatsapp.read-timeout=${WCS_WHATSAPP_READ_TIMEOUT:PT5S}

wcs.ai.provider=${WCS_LLM_PROVIDER:mock}
wcs.ai.model=${WCS_LLM_MODEL:llm.mock.v1}
wcs.ai.mock-reply=${WCS_LLM_MOCK_REPLY:Gracias por escribirnos. Un agente revisará tu consulta.}
wcs.rag.provider=${WCS_RAG_PROVIDER:mock}
wcs.rag.max-results=${WCS_RAG_MAX_RESULTS:5}

# AWS AppConfig / Secrets Manager locations. The AWS-backed config loader is
# enabled by its deployment profile; these names never contain secret values.
wcs.external-config.appconfig.application=${AWS_APPCONFIG_APPLICATION:wcs}
wcs.external-config.appconfig.environment=${AWS_APPCONFIG_ENVIRONMENT:local}
wcs.external-config.appconfig.profile=${AWS_APPCONFIG_PROFILE:default}
wcs.external-config.secrets-manager.secret-id=${AWS_SECRETS_MANAGER_SECRET_ID:}

wcs.outbox.poll-interval-ms=${WCS_OUTBOX_POLL_INTERVAL_MS:5000}
wcs.outbox.max-attempts=${WCS_OUTBOX_MAX_ATTEMPTS:3}

# HTTPS_CALLBACK_URL is configured in Meta/the temporary tunnel and is not
# consumed by the local Spring Boot process.
