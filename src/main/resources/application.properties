spring.application.name=wally-customer-support
server.port=8080
spring.profiles.default=prod

# Static application contract. Dynamic runtime values are loaded from
# AWS AppConfig and AWS Secrets Manager before Spring binds application beans.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=wcs
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=wcs
spring.flyway.schemas=wcs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Bedrock on-demand pricing reference for openai.gpt-oss-20b-1:0 in us-east-1.
# AppConfig may override these values when the selected model or pricing tier changes.
wcs.ai.pricing-version=aws-bedrock-us-east-1-standard-2026-09
wcs.ai.input-price-usd-per-million-tokens=0.0721
wcs.ai.output-price-usd-per-million-tokens=0.3090
wcs.ai.request-timeout=PT30S
wcs.ai.prompt.intent-version=conversation-intent-v2
wcs.ai.prompt.provider=classpath
wcs.ai.prompt.intent-max-output-tokens=1024
wcs.ai.prompt.intent-temperature=0.0
wcs.ai.prompt.max-input-characters=2000
wcs.ai.prompt.max-history-messages=12
wcs.ai.response.prompt-version=conversation-response-v1
wcs.ai.response.max-output-tokens=1024
wcs.ai.response.temperature=0.2
wcs.ai.response.max-input-characters=2000
wcs.ai.response.max-history-messages=6
wcs.ai.response.max-knowledge-characters=8000
wcs.ai.response.max-summary-characters=4000

# Bedrock Prompt Management is opt-in. The identifiers are immutable prompt
# resources, never prompt bodies or secrets. Configure them in AppConfig only
# when wcs.ai.prompt.provider=bedrock.
wcs.ai.prompt.management.intent-identifier=
wcs.ai.prompt.management.intent-version=
wcs.ai.prompt.management.response-identifier=
wcs.ai.prompt.management.response-version=

# Model output is parsed and bounded by the application before routing.
wcs.conversation.guardrails.min-intent-confidence=0.65

# Short-lived conversational context. AppConfig may override these values;
# production activation remains subject to the approved retention policy.
wcs.conversation.memory.enabled=false
wcs.conversation.memory.ttl=PT24H
wcs.conversation.memory.max-messages=20
wcs.conversation.memory.max-message-characters=2000
wcs.conversation.summary.enabled=false
wcs.conversation.summary.trigger-message-count=12
wcs.conversation.summary.recent-message-count=6
wcs.conversation.summary.trigger-characters=12000
wcs.conversation.summary.max-summary-characters=4000
wcs.conversation.preferences.enabled=false
wcs.conversation.preferences.ttl=PT24H
wcs.conversation.preferences.max-preferences=5
wcs.conversation.preferences.max-value-characters=64
wcs.conversation.retention.enabled=false
wcs.conversation.retention.content-retention=PT720H
wcs.conversation.retention.metadata-retention=PT2160H
wcs.conversation.retention.aggregate-metrics-retention=PT8760H
wcs.conversation.retention.cleanup-batch-size=500
wcs.conversation.retention.schedule-delay-ms=86400000

# Durable inbound processing. The webhook only persists the message and queue
# record; the scheduled worker performs conversation/LLM work asynchronously.
wcs.inbound.poll-interval-ms=1000
wcs.inbound.batch-size=20
wcs.inbound.max-attempts=3
wcs.inbound.lease-duration=PT5M
wcs.inbound.retry-delay=PT30S

# Agent registry consumption remains disabled until the runtime activation gate
# is explicitly approved. The environment is the AppConfig environment key.
wcs.agent-runtime.activation-enabled=false
wcs.agent-runtime.environment=prod
wcs.agent-runtime.shadow-enabled=false
wcs.agent-runtime.shadow-timeout=PT5S
wcs.agent-runtime.shadow-provider=noop
wcs.agent-runtime.shadow-allowed-environments=test
wcs.agent-runtime.shadow-traffic-percentage=0
wcs.agent-runtime.shadow-quality.minimum-sample-size=20
wcs.agent-runtime.shadow-quality.maximum-failure-rate=0.10
wcs.agent-runtime.shadow-quality.maximum-mismatch-rate=0.15
wcs.agent-runtime.shadow-quality.maximum-unknown-rate=0.10
wcs.agent-runtime.shadow-quality.maximum-latency-p95-ms=5000
wcs.agent-runtime.shadow-quality.maximum-average-cost-usd=0.0100
wcs.agent-registry.activation-write-enabled=false
wcs.agent-registry.authoring-write-enabled=false
wcs.agent-evaluation.control-plane.allowed-environment=prod
wcs.agent-evaluation.control-plane.security.enabled=false
wcs.agent-evaluation.control-plane.security.issuer-uri=
wcs.agent-evaluation.control-plane.security.audience=
wcs.agent-evaluation.authorization.allowed-environment=prod
wcs.agent-evaluation.trigger.enabled=false
wcs.agent-evaluation.executor=deterministic
wcs.agent-evaluation.max-scenarios=10
wcs.agent-evaluation.max-input-tokens-per-scenario=4000
wcs.agent-evaluation.max-output-tokens=512
wcs.agent-evaluation.max-estimated-cost-usd=0.0500
wcs.agent-evaluation.timeout=PT30S

# The operational backoffice is disabled in production until its JWT/role
# boundary is connected. Local smoke may explicitly enable local mode.
wcs.backoffice.enabled=false
wcs.backoffice.local-mode-enabled=false
wcs.backoffice.security.enabled=false
wcs.backoffice.preview.enabled=false
wcs.backoffice.preview.token=
wcs.backoffice.media.enabled=false
wcs.backoffice.media.bucket=
wcs.backoffice.media.prefix=wcs/catalog
wcs.backoffice.media.region=us-east-1

# Payment provider configuration. The access token and webhook secret are
# resolved from the dedicated Mercado Pago secret when the provider is enabled.
wcs.payment.provider=mock
wcs.payment.currency=ARS
wcs.payment.notification-url=
wcs.payment.request-timeout=PT10S
wcs.payment.mercado-pago.access-token=
wcs.payment.webhook.signature-required=true
wcs.payment.webhook.secret=

# Business flags use a separate AppConfig hosted profile. They are polled at
# runtime and never replace the technical runtime profile or Secrets Manager.
wcs.feature-flags.enabled=true
wcs.feature-flags.fail-closed=true
wcs.feature-flags.poll-interval-ms=30000
wcs.feature-flags.stale-after-ms=300000
wcs.feature-flags.appconfig.application=wally-customer-support
wcs.feature-flags.appconfig.environment=prod
wcs.feature-flags.appconfig.profile=feature-flags
wcs.feature-flags.publisher.enabled=false
wcs.feature-flags.publisher.deployment-strategy-id=wally-customer-support-prod-all-at-once

# AWS external-configuration bootstrap. These are the only dynamic values
# needed before AppConfig and Secrets Manager can populate Spring properties.
wcs.observability.actor-key-secret=
wcs.external-config.appconfig.application=wally-customer-support
wcs.external-config.appconfig.environment=prod
wcs.external-config.appconfig.profile=runtime
wcs.external-config.appconfig.enabled=true
wcs.external-config.appconfig.fail-fast=true
wcs.external-config.secrets-manager.enabled=true
wcs.external-config.secrets-manager.fail-fast=true
wcs.external-config.secrets-manager.backoffice-secret-id=
wcs.external-config.secrets-manager.observability-secret-id=
wcs.external-config.secrets-manager.mercado-pago-secret-id=
