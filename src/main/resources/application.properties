spring.application.name=wally-customer-support
server.port=8080
spring.profiles.default=prod

# Static application contract. Dynamic runtime values are loaded from
# AWS AppConfig and AWS Secrets Manager before Spring binds application beans.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=wcs
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=wcs
spring.flyway.schemas=wcs
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Bedrock on-demand pricing reference for openai.gpt-oss-20b-1:0 in us-east-1.
# AppConfig may override these values when the selected model or pricing tier changes.
wcs.ai.pricing-version=aws-bedrock-us-east-1-standard-2026-09
wcs.ai.input-price-usd-per-million-tokens=0.0721
wcs.ai.output-price-usd-per-million-tokens=0.3090

# Short-lived conversational context. AppConfig may override these values;
# production activation remains subject to the approved retention policy.
wcs.conversation.memory.enabled=false
wcs.conversation.memory.ttl=PT24H
wcs.conversation.memory.max-messages=20
wcs.conversation.memory.max-message-characters=2000
wcs.conversation.summary.enabled=false
wcs.conversation.summary.trigger-message-count=12
wcs.conversation.summary.recent-message-count=6
wcs.conversation.summary.trigger-characters=12000
wcs.conversation.summary.max-summary-characters=4000
wcs.conversation.preferences.enabled=false
wcs.conversation.preferences.ttl=PT24H
wcs.conversation.preferences.max-preferences=5
wcs.conversation.preferences.max-value-characters=64

# Agent registry consumption remains disabled until the runtime activation gate
# is explicitly approved. The environment is the AppConfig environment key.
wcs.agent-runtime.activation-enabled=false
wcs.agent-runtime.environment=prod
wcs.agent-evaluation.control-plane.allowed-environment=prod
wcs.agent-evaluation.control-plane.security.enabled=false
wcs.agent-evaluation.control-plane.security.issuer-uri=
wcs.agent-evaluation.control-plane.security.audience=
wcs.agent-evaluation.authorization.allowed-environment=prod
wcs.agent-evaluation.trigger.enabled=false

# AWS external-configuration bootstrap. These are the only dynamic values
# needed before AppConfig and Secrets Manager can populate Spring properties.
wcs.external-config.appconfig.application=wally-customer-support
wcs.external-config.appconfig.environment=prod
wcs.external-config.appconfig.profile=runtime
wcs.external-config.appconfig.enabled=true
wcs.external-config.appconfig.fail-fast=true
wcs.external-config.secrets-manager.enabled=true
wcs.external-config.secrets-manager.fail-fast=true
