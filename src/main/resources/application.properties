spring.application.name=wally-customer-support-whatsapp-poc
server.port=${SERVER_PORT:8080}

# Values are injected from the environment or the ignored local .env file.
# Never store real credentials in this file.
wcs.poc.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:}
wcs.poc.whatsapp.graph-api-base-url=${WHATSAPP_GRAPH_API_BASE_URL:}
wcs.poc.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
wcs.poc.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:}
wcs.poc.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
wcs.poc.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
wcs.poc.whatsapp.app-secret=${META_APP_SECRET:}
wcs.poc.whatsapp.allowed-recipient=${POC_ALLOWED_RECIPIENT:}
wcs.poc.whatsapp.fixed-reply=${POC_FIXED_REPLY:}
wcs.poc.whatsapp.reply-mode=${POC_REPLY_MODE:}
wcs.poc.whatsapp.template-name=${POC_TEMPLATE_NAME:}
wcs.poc.whatsapp.template-language-code=${POC_TEMPLATE_LANGUAGE_CODE:}
wcs.poc.whatsapp.template-body-parameters=${POC_TEMPLATE_BODY_PARAMETERS:}
wcs.poc.whatsapp.connect-timeout=${POC_CONNECT_TIMEOUT:}
wcs.poc.whatsapp.read-timeout=${POC_READ_TIMEOUT:}

# HTTPS_CALLBACK_URL is configured in Meta/the temporary tunnel and is not
# consumed by the local Spring Boot process.
