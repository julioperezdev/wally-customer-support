name: Terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Run a plan or apply the reviewed plan"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      confirm_apply:
        description: "Required for apply after reviewing a successful plan"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TF_WORKING_DIR: infra/environments/prod
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform Init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan-or-apply:
    name: Terraform Plan / Apply (manual)
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_TERRAFORM_ROLE_ARN: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check apply guardrails
        if: inputs.action == 'apply'
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/main" ] || {
            echo "::error::Terraform apply is allowed only from main"
            exit 1
          }
          [ "$CONFIRM_APPLY" = "true" ] || {
            echo "::error::Set confirm_apply=true only after reviewing a successful plan"
            exit 1
          }

      - name: Check Terraform deployment configuration
        env:
          TERRAFORM_VARS: ${{ secrets.TERRAFORM_VARS }}
        run: |
          set -euo pipefail
          [ -n "$AWS_TERRAFORM_ROLE_ARN" ] || {
            echo "::error::Configure AWS_TERRAFORM_ROLE_ARN in the production environment"
            exit 1
          }
          [ -n "$TERRAFORM_VARS" ] || {
            echo "::error::Configure TERRAFORM_VARS with reviewed non-secret Terraform variables"
            exit 1
          }

      - name: Write reviewed Terraform variables
        env:
          TERRAFORM_VARS: ${{ secrets.TERRAFORM_VARS }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$TERRAFORM_VARS" > "$RUNNER_TEMP/wcs-terraform.tfvars"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"

      - name: Terraform Init with reviewed backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform Plan (captured, no sensitive output)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set +e
          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out="$RUNNER_TEMP/wcs.tfplan" \
            -var-file="$RUNNER_TEMP/wcs-terraform.tfvars" \
            -no-color > "$RUNNER_TEMP/wcs-terraform-plan.log" 2>&1
          plan_exit=$?
          set -e

          case "$plan_exit" in
            0|2) ;;
            *)
              echo "::error::Terraform plan failed. Check AWS identity, backend access and reviewed variables."
              exit "$plan_exit"
              ;;
          esac

      - name: Summarize and block destructive plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          plan_json="$RUNNER_TEMP/wcs-terraform-plan.json"
          terraform show -json "$RUNNER_TEMP/wcs.tfplan" > "$plan_json"

          create_count="$(jq '[.resource_changes[]? | select((.change.actions | index("create")) != null and (.change.actions | index("delete")) == null)] | length' "$plan_json")"
          update_count="$(jq '[.resource_changes[]? | select((.change.actions | index("update")) != null)] | length' "$plan_json")"
          destroy_count="$(jq '[.resource_changes[]? | select((.change.actions | index("delete")) != null)] | length' "$plan_json")"
          replace_count="$(jq '[.resource_changes[]? | select((.change.actions | index("create")) != null and (.change.actions | index("delete")) != null)] | length' "$plan_json")"

          {
            echo "### Terraform plan summary"
            echo "- Create: $create_count"
            echo "- Update: $update_count"
            echo "- Destroy: $destroy_count"
            echo "- Replace: $replace_count"
            echo
            echo "Resource addresses and actions:"
            jq -r '[.resource_changes[]? | select((.change.actions | index("no-op")) == null and (.change.actions | index("read")) == null) | "- `\(.address)`: \(.change.actions | join(","))"] | if length == 0 then "- No resource changes" else .[] end' "$plan_json"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$destroy_count" -gt 0 ]; then
            echo "::error::Terraform plan contains destroy actions; the CI guardrail blocks plan/apply."
            jq -r '[.resource_changes[]? | select((.change.actions | index("delete")) != null) | "\(.address): \(.change.actions | join(","))"] | .[]' "$plan_json"
            exit 1
          fi

          if [ "$replace_count" -gt 0 ]; then
            echo "::error::Terraform plan contains replacement actions; the CI guardrail blocks plan/apply."
            jq -r '[.resource_changes[]? | select((.change.actions | index("create")) != null and (.change.actions | index("delete")) != null) | "\(.address): \(.change.actions | join(","))"] | .[]' "$plan_json"
            exit 1
          fi

      - name: Apply reviewed plan
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -auto-approve "$RUNNER_TEMP/wcs.tfplan"
