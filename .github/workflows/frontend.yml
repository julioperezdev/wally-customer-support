name: Frontend Backoffice

on:
  pull_request:
    paths:
      - "backoffice/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "backoffice/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: backoffice

jobs:
  verify:
    name: Backoffice test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm run check
